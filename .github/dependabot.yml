version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "vherbruck"
    labels:
      - "dependencies"
    groups:
      remark-rehype:
        patterns:
          - "unified"
          - "remark-*"
          - "rehype-*"
          - "hast-*"
          - "mdast-*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
