name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # The hydration check runs under Node, and jsdom 29 needs Node 20.19+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Builds the packages, then the example apps
      - run: bun run build

      - run: bun run --filter solid-streamdown test:hydration

      - run: bun run test

      # Every TypeScript sample in docs/guide matches its example file
      - run: bun run docs:check

      - run: bunx playwright install --with-deps chromium

      # Smoke tests of both example apps in Chromium
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # Runs only after every check above passed on a push to main. With unreleased
  # changesets it opens or updates the "Version Packages" PR; otherwise it
  # publishes every package whose version is not on npm yet. In Changesets pre
  # mode (.changeset/pre.json) that publish goes to the pre tag, not `latest`.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # npm provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # `changeset publish` runs npm. No registry-url here: the Changesets
      # action writes ~/.npmrc from NPM_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      # changesets/action v1.9.0 (the line for Changesets CLI 2.x), pinned
      # because this job holds the npm token.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
