name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # The hydration check runs under Node, and jsdom 29 needs Node 20.19+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Builds the packages, then the example apps
      - run: bun run build

      - run: bun run --filter solid-streamdown test:hydration

      - run: bun run test

      # Every TypeScript sample in docs/guide matches its example file
      - run: bun run docs:check

      - run: bunx playwright install --with-deps chromium

      # Smoke tests of both example apps in Chromium
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
