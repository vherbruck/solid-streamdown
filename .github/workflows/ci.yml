name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The hydration check runs under Node, and jsdom 29 needs Node 20.19+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      - run: bun run --filter solid-streamdown test:hydration

      - run: bun run test
